# UV Configuration - Modernized with Security Updates
# Version: 2.0.0
# UV Version: 0.4.0+
# Last Updated: 2025-09-28

[project]
name = "aceengineercode"
version = "0.1.0"
description = "ACE Engineer Code - Engineering Analysis Tools"
requires-python = ">=3.9"

dependencies = [
    "Flask>=3.0.0",
    "pandas>=2.1.4",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0.25",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
]

[tool.uv]
python = "3.11"
system = false
compile = true
seed = true

# Development dependencies
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "ipython>=8.20.0",
]

# Package configuration
[tool.uv.pip]
index-url = "https://pypi.org/simple"
pre = false
no-cache = false

# Virtual environment
[tool.uv.venv]
prompt = "aceengineercode"
system-site-packages = false

# Parallel processing for package installation
[tool.uv.parallel]
enabled = true
jobs = 4

# UV Scripts for common tasks
[tool.uv.scripts]
test = "pytest tests/ -v"
test-cov = "pytest tests/ --cov=src --cov-report=term-missing"
lint = "ruff check . && black --check . && mypy src/"
format = "ruff check . --fix && black ."
typecheck = "mypy src/ --strict"
security = "pip-audit --fix"
dev = "python -m IPython"
clean = """
    rm -rf build dist *.egg-info .coverage htmlcov .pytest_cache .mypy_cache .ruff_cache
    find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
"""
update = "uv pip compile --upgrade && uv lock --upgrade"
